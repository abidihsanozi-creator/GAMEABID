<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelajah Habitat – Sahabat Alam Liar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #6C4EBD;
    --purple-light: #EEEDFE;
    --purple-dark: #3C3489;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --amber: #F5A623;
    --amber-light: #FFF3DB;
    --red: #E74C3C;
    --red-light: #FDECEA;
    --bg: #F5F3FF;
    --card: #fff;
    --text: #1e1a3a;
    --muted: #7a73a8;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header { text-align: center; margin-bottom: 24px; }
  .game-label {
    display: inline-block;
    background: var(--purple);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 4px 14px;
    border-radius: 99px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 800;
    color: var(--purple-dark);
    line-height: 1.2;
  }
  h1 span { color: var(--purple); }
  .subtitle { font-size: 14px; color: var(--muted); margin-top: 6px; }

  .main-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    max-width: 580px;
    width: 100%;
    box-shadow: 0 4px 32px rgba(108,78,189,.1);
  }

  .instr {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 20px;
    font-weight: 600;
  }

  .score-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .score-pill {
    padding: 6px 18px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
  }
  .score-pill.b { background: var(--teal-light); color: #085041; }
  .score-pill.s { background: var(--red-light); color: var(--red); }
  .score-pill.t { background: var(--purple-light); color: var(--purple-dark); }

  .animals-pool {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 24px;
    min-height: 60px;
    padding: 12px;
    border-radius: 14px;
    background: var(--purple-light);
    border: 2px dashed #c0b8f0;
  }
  .animal-chip {
    font-size: 36px;
    padding: 8px 14px;
    border-radius: 12px;
    background: #fff;
    border: 2px solid #c0b8f0;
    cursor: pointer;
    transition: all .18s;
    user-select: none;
    position: relative;
  }
  .animal-chip:hover:not(.placed) { transform: scale(1.12); border-color: var(--purple); }
  .animal-chip.selected {
    border-color: var(--purple);
    background: var(--purple-light);
    transform: scale(1.08);
    box-shadow: 0 0 0 3px rgba(108,78,189,.25);
  }
  .animal-chip.placed { opacity: .3; pointer-events: none; filter: grayscale(1); }
  .chip-name {
    display: block;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    color: var(--purple-dark);
    margin-top: 2px;
  }

  .zones-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .zone {
    border: 2.5px dashed #c0b8f0;
    border-radius: 16px;
    padding: 12px 8px;
    min-height: 140px;
    text-align: center;
    cursor: pointer;
    transition: all .18s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .zone:hover { background: var(--purple-light); border-color: var(--purple); }
  .zone.active { background: var(--purple-light); border-color: var(--purple); border-style: solid; }
  .zone.flash-ok { background: var(--teal-light); border-color: var(--teal); border-style: solid; }
  .zone.flash-err { background: var(--red-light); border-color: var(--red); border-style: solid; }
  .zone-icon { font-size: 28px; margin-bottom: 4px; }
  .zone-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--purple-dark);
    margin-bottom: 8px;
  }
  .zone-animals { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .zone-placed { font-size: 24px; }

  .feedback {
    text-align: center;
    min-height: 22px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .feedback.ok { color: #085041; }
  .feedback.err { color: var(--red); }

  .action-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    font-family: 'Baloo 2', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all .18s;
  }
  .btn-primary { background: var(--purple); color: #fff; }
  .btn-primary:hover { background: var(--purple-dark); transform: translateY(-1px); }
  .btn-secondary { background: var(--purple-light); color: var(--purple-dark); }
  .btn-secondary:hover { background: #d8d4f8; }

  /* Win overlay */
  .win-box {
    text-align: center;
    padding: 10px 0;
    display: none;
  }
  .win-emoji { font-size: 60px; margin-bottom: 10px; }
  .win-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--purple-dark);
    margin-bottom: 6px;
  }
  .win-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }

  .home-link { margin-top: 20px; display: block; text-align: center; font-size: 13px; color: var(--muted); text-decoration: none; }
  .home-link:hover { color: var(--purple); }

  @media (max-width: 420px) {
    .zones-grid { grid-template-columns: 1fr; }
    .zone { min-height: 80px; flex-direction: row; gap: 12px; text-align: left; }
    .zone-animals { justify-content: flex-start; }
  }
</style>
</head>
<body>

<header>
  <span class="game-label">Game 2 · Sahabat Alam Liar</span>
  <h1>Jelajah <span>Habitat</span></h1>
  <p class="subtitle">Taruh setiap hewan di habitat yang tepat!</p>
</header>

<div class="main-card" id="main-card">
  <div class="score-row">
    <span class="score-pill b" id="s-benar">✅ Benar: 0</span>
    <span class="score-pill s" id="s-salah">❌ Salah: 0</span>
    <span class="score-pill t" id="s-sisa">Tersisa: 8</span>
  </div>

  <p class="instr">1️⃣ Pilih hewan di bawah → 2️⃣ Klik zona habitat yang tepat</p>

  <div class="animals-pool" id="pool"></div>

  <div class="zones-grid">
    <div class="zone" id="z-air" onclick="dropTo('air')">
      <div class="zone-icon">💧</div>
      <div class="zone-name">Air / Kolam</div>
      <div class="zone-animals" id="za-air"></div>
    </div>
    <div class="zone" id="z-darat" onclick="dropTo('darat')">
      <div class="zone-icon">🌿</div>
      <div class="zone-name">Padang Rumput</div>
      <div class="zone-animals" id="za-darat"></div>
    </div>
    <div class="zone" id="z-hutan" onclick="dropTo('hutan')">
      <div class="zone-icon">🌳</div>
      <div class="zone-name">Hutan / Kebun</div>
      <div class="zone-animals" id="za-hutan"></div>
    </div>
  </div>

  <div class="feedback" id="feedback">Pilih hewan terlebih dahulu!</div>

  <div class="win-box" id="win-box">
    <div class="win-emoji">🎉</div>
    <div class="win-title">Luar Biasa!</div>
    <div class="win-sub" id="win-sub"></div>
  </div>

  <div class="action-row">
    <button class="btn btn-secondary" onclick="resetGame()">🔄 Mulai Ulang</button>
  </div>
</div>

<a href="index.html" class="home-link">← Kembali ke menu</a>

<script>
const animals = [
  { emoji:'🐸', name:'Katak',     habitat:'air' },
  { emoji:'🐢', name:'Kura-kura', habitat:'air' },
  { emoji:'🦆', name:'Bebek',     habitat:'air' },
  { emoji:'🐟', name:'Ikan',      habitat:'air' },
  { emoji:'🐄', name:'Sapi',      habitat:'darat' },
  { emoji:'🐰', name:'Kelinci',   habitat:'darat' },
  { emoji:'🦌', name:'Rusa',      habitat:'hutan' },
  { emoji:'🦔', name:'Landak',    habitat:'hutan' },
];

let selected = null, benar = 0, salah = 0, placed = 0;

function buildPool() {
  const pool = document.getElementById('pool');
  pool.innerHTML = '';
  animals.forEach((a, i) => {
    const el = document.createElement('div');
    el.className = 'animal-chip';
    el.dataset.i = i;
    el.dataset.habitat = a.habitat;
    el.innerHTML = a.emoji + '<span class="chip-name">' + a.name + '</span>';
    el.onclick = () => selectAnimal(el, i);
    pool.appendChild(el);
  });
}

function selectAnimal(el, i) {
  if (el.classList.contains('placed')) return;
  document.querySelectorAll('.animal-chip').forEach(c => c.classList.remove('selected'));
  selected = el;
  el.classList.add('selected');
  setFeedback(animals[i].name + ' dipilih. Sekarang klik habitatnya!', '');
  document.querySelectorAll('.zone').forEach(z => z.classList.add('active'));
}

function dropTo(zone) {
  if (!selected) { setFeedback('Pilih hewan dulu ya!', 'err'); return; }
  const correct = selected.dataset.habitat;
  const i = parseInt(selected.dataset.i);
  const a = animals[i];
  document.querySelectorAll('.zone').forEach(z => z.classList.remove('active'));

  if (zone === correct) {
    benar++; placed++;
    flashZone('z-' + zone, 'ok');
    const item = document.createElement('span');
    item.className = 'zone-placed';
    item.title = a.name;
    item.textContent = a.emoji;
    document.getElementById('za-' + zone).appendChild(item);
    selected.classList.add('placed');
    setFeedback('✅ Benar! ' + a.name + ' memang hidup di ' + zoneName(zone) + '.', 'ok');
    if (placed === animals.length) setTimeout(showWin, 400);
  } else {
    salah++;
    flashZone('z-' + zone, 'err');
    selected.classList.remove('selected');
    setFeedback('❌ Bukan di sini! Coba zona yang lain.', 'err');
  }
  selected = null;
  document.getElementById('s-benar').textContent = '✅ Benar: ' + benar;
  document.getElementById('s-salah').textContent = '❌ Salah: ' + salah;
  document.getElementById('s-sisa').textContent = 'Tersisa: ' + (animals.length - placed);
}

function flashZone(id, cls) {
  const el = document.getElementById(id);
  el.classList.add('flash-' + cls);
  setTimeout(() => el.classList.remove('flash-' + cls), 700);
}

function zoneName(z) {
  return z === 'air' ? 'air/kolam' : z === 'darat' ? 'padang rumput' : 'hutan';
}

function setFeedback(msg, cls) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback' + (cls ? ' ' + cls : '');
}

function showWin() {
  document.getElementById('win-box').style.display = 'block';
  document.getElementById('win-sub').textContent =
    'Semua ' + animals.length + ' hewan sudah di tempat yang tepat! ' +
    (salah === 0 ? 'Tanpa satu pun kesalahan — luar biasa!' : 'Total ' + salah + ' percobaan salah.');
}

function resetGame() {
  selected = null; benar = 0; salah = 0; placed = 0;
  document.getElementById('win-box').style.display = 'none';
  document.getElementById('s-benar').textContent = '✅ Benar: 0';
  document.getElementById('s-salah').textContent = '❌ Salah: 0';
  document.getElementById('s-sisa').textContent = 'Tersisa: ' + animals.length;
  ['air','darat','hutan'].forEach(z => document.getElementById('za-' + z).innerHTML = '');
  setFeedback('Pilih hewan terlebih dahulu!', '');
  buildPool();
}

buildPool();
</script>
</body>
</html>

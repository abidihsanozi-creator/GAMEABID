<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Hewan – Sahabat Alam Liar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --amber: #E8960A;
    --amber-light: #FFF8E1;
    --amber-dark: #7A4E00;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --red: #E74C3C;
    --red-light: #FDECEA;
    --bg: #FFFBF0;
    --card: #fff;
    --text: #2d2000;
    --muted: #8a7340;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header { text-align: center; margin-bottom: 24px; }
  .game-label {
    display: inline-block;
    background: var(--amber);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 4px 14px;
    border-radius: 99px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 800;
    color: var(--amber-dark);
    line-height: 1.2;
  }
  h1 span { color: var(--amber); }
  .subtitle { font-size: 14px; color: var(--muted); margin-top: 6px; }

  .main-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    max-width: 540px;
    width: 100%;
    box-shadow: 0 4px 32px rgba(232,150,10,.12);
  }

  .stats-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-pill {
    padding: 6px 18px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
  }
  .stat-pill.steps { background: var(--amber-light); color: var(--amber-dark); }
  .stat-pill.pairs { background: var(--teal-light); color: #085041; }

  .instr { text-align:center; font-size:14px; color:var(--muted); font-weight:600; margin-bottom:18px; }

  /* Level selector */
  .level-row { display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
  .lvl-btn {
    padding: 6px 16px;
    border-radius: 99px;
    border: 2px solid #f0d88a;
    background: var(--amber-light);
    font-size: 12px;
    font-weight: 700;
    color: var(--amber-dark);
    cursor: pointer;
    transition: all .15s;
  }
  .lvl-btn.active, .lvl-btn:hover { background: var(--amber); color: #fff; border-color: var(--amber); }

  .grid {
    display: grid;
    gap: 10px;
    margin-bottom: 18px;
    justify-items: center;
  }
  .grid.cols4 { grid-template-columns: repeat(4, 1fr); }
  .grid.cols6 { grid-template-columns: repeat(6, 1fr); }

  .tile {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 14px;
    border: 2.5px solid #f0d88a;
    background: var(--amber-light);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s, background .15s, border-color .15s;
    font-size: clamp(20px, 5vw, 32px);
    user-select: none;
    overflow: hidden;
    padding: 4px;
  }
  .tile:hover:not(.matched):not(.flipped) { transform: scale(1.06); border-color: var(--amber); }
  .tile.face-down { font-size: 0; color: transparent; }
  .tile.face-down::after { content: '?'; font-size: clamp(20px, 4vw, 28px); font-weight: 900; color: #f0d88a; font-family: 'Baloo 2', sans-serif; }
  .tile.flipped { background: #FFF3C4; border-color: var(--amber); }
  .tile.matched { background: var(--teal-light); border-color: var(--teal); cursor: default; }
  .tile.matched::after { display: none; }
  .tile.wrong { background: var(--red-light); border-color: var(--red); }
  .tile-label { font-size: clamp(10px, 2vw, 13px); font-weight: 700; text-align: center; line-height: 1.2; color: var(--amber-dark); }
  .tile.matched .tile-label { color: #085041; }

  .feedback { text-align:center; font-size:13px; font-weight:600; color:var(--muted); min-height:20px; margin-bottom:16px; }
  .feedback.ok { color: #085041; }
  .feedback.err { color: var(--red); }

  /* Win state */
  .win-box { display:none; text-align:center; padding:16px 0 8px; }
  .win-emoji { font-size:56px; margin-bottom:8px; }
  .win-title { font-family:'Baloo 2',sans-serif; font-size:24px; font-weight:800; color:var(--amber-dark); margin-bottom:4px; }
  .win-sub { font-size:14px; color:var(--muted); margin-bottom:18px; }

  .action-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn {
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    font-family: 'Baloo 2', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all .18s;
  }
  .btn-primary { background: var(--amber); color: #fff; }
  .btn-primary:hover { background: #c47c00; transform: translateY(-1px); }
  .btn-secondary { background: var(--amber-light); color: var(--amber-dark); }
  .btn-secondary:hover { background: #fdeea0; }

  .home-link { margin-top:20px; display:block; text-align:center; font-size:13px; color:var(--muted); text-decoration:none; }
  .home-link:hover { color:var(--amber); }

  @media (max-width:380px) {
    .grid.cols4 { grid-template-columns: repeat(4, 1fr); gap:6px; }
    .tile { border-radius:10px; }
  }
</style>
</head>
<body>

<header>
  <span class="game-label">Game 3 · Sahabat Alam Liar</span>
  <h1>Memory <span>Hewan</span></h1>
  <p class="subtitle">Pasangkan gambar hewan dengan namanya!</p>
</header>

<div class="main-card">
  <div class="stats-row">
    <span class="stat-pill steps" id="stat-steps">👣 Langkah: 0</span>
    <span class="stat-pill pairs" id="stat-pairs">🎯 Pasangan: 0</span>
  </div>

  <p class="instr">Pilih tingkat kesulitan:</p>
  <div class="level-row">
    <button class="lvl-btn active" onclick="setLevel(4, this)">Mudah (4 pasang)</button>
    <button class="lvl-btn" onclick="setLevel(6, this)">Sedang (6 pasang)</button>
    <button class="lvl-btn" onclick="setLevel(8, this)">Sulit (8 pasang)</button>
  </div>

  <div class="grid cols4" id="grid"></div>
  <div class="feedback" id="feedback">Klik dua kartu untuk mencari pasangannya!</div>

  <div class="win-box" id="win-box">
    <div class="win-emoji">🏆</div>
    <div class="win-title">Selamat!</div>
    <div class="win-sub" id="win-sub"></div>
  </div>

  <div class="action-row">
    <button class="btn btn-secondary" onclick="startGame()">🔄 Acak Ulang</button>
  </div>
</div>

<a href="index.html" class="home-link">← Kembali ke menu</a>

<script>
const allAnimals = [
  { id:'katak',    emoji:'🐸', label:'Katak' },
  { id:'kelinci',  emoji:'🐰', label:'Kelinci' },
  { id:'kura',     emoji:'🐢', label:'Kura-kura' },
  { id:'sapi',     emoji:'🐄', label:'Sapi' },
  { id:'bebek',    emoji:'🦆', label:'Bebek' },
  { id:'ikan',     emoji:'🐟', label:'Ikan' },
  { id:'rusa',     emoji:'🦌', label:'Rusa' },
  { id:'kupu',     emoji:'🦋', label:'Kupu-kupu' },
];

let pairCount = 4, steps = 0, matchedCount = 0, flipped = [], locked = false, tiles = [];

function setLevel(n, btn) {
  document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pairCount = n;
  const g = document.getElementById('grid');
  g.className = 'grid ' + (n <= 4 ? 'cols4' : 'cols6');
  startGame();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  steps = 0; matchedCount = 0; flipped = []; locked = false;
  document.getElementById('stat-steps').textContent = '👣 Langkah: 0';
  document.getElementById('stat-pairs').textContent = '🎯 Pasangan: 0/' + pairCount;
  document.getElementById('win-box').style.display = 'none';
  document.getElementById('feedback').textContent = 'Klik dua kartu untuk mencari pasangannya!';
  document.getElementById('feedback').className = 'feedback';

  const chosen = shuffle([...allAnimals]).slice(0, pairCount);
  tiles = shuffle([
    ...chosen.map(a => ({ ...a, type:'emoji' })),
    ...chosen.map(a => ({ ...a, type:'label' })),
  ]);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  tiles.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'tile face-down';
    el.dataset.i = i;
    el.dataset.id = t.id;
    el.dataset.type = t.type;
    el.dataset.content = t.type === 'emoji' ? t.emoji : t.label;
    el.onclick = () => flip(el, t);
    grid.appendChild(el);
  });
}

function flip(el, t) {
  if (locked || el.classList.contains('matched') || el.classList.contains('flipped')) return;
  el.classList.remove('face-down');
  el.classList.add('flipped');
  if (t.type === 'emoji') {
    el.textContent = t.emoji;
  } else {
    el.innerHTML = '<span class="tile-label">' + t.label + '</span>';
  }
  flipped.push(el);

  if (flipped.length === 2) {
    steps++;
    document.getElementById('stat-steps').textContent = '👣 Langkah: ' + steps;
    locked = true;
    const [a, b] = flipped;
    if (a.dataset.id === b.dataset.id && a !== b) {
      a.classList.add('matched'); b.classList.add('matched');
      a.classList.remove('flipped'); b.classList.remove('flipped');
      matchedCount++;
      document.getElementById('stat-pairs').textContent = '🎯 Pasangan: ' + matchedCount + '/' + pairCount;
      const fb = document.getElementById('feedback');
      fb.textContent = '✅ Pasangan ditemukan! ' + tiles[a.dataset.i].emoji || tiles[a.dataset.i].label;
      fb.className = 'feedback ok';
      flipped = []; locked = false;
      if (matchedCount === pairCount) setTimeout(showWin, 400);
    } else {
      [a, b].forEach(el => el.classList.add('wrong'));
      const fb = document.getElementById('feedback');
      fb.textContent = '❌ Belum cocok! Coba ingat posisinya.';
      fb.className = 'feedback err';
      setTimeout(() => {
        [a, b].forEach(el => {
          el.classList.remove('flipped','wrong');
          el.classList.add('face-down');
          el.textContent = '';
          el.innerHTML = '';
        });
        flipped = []; locked = false;
      }, 900);
    }
  }
}

function showWin() {
  document.getElementById('win-box').style.display = 'block';
  const rating = steps <= pairCount * 2 ? 'Memori sempurna! 🌟' :
                 steps <= pairCount * 3 ? 'Bagus sekali! 👍' : 'Terus berlatih! 💪';
  document.getElementById('win-sub').textContent =
    pairCount + ' pasangan ditemukan dalam ' + steps + ' langkah. ' + rating;
}

startGame();
</script>
</body>
</html>
